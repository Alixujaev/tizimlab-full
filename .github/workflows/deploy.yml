# Production deploy: CI `main` da yashil bo'lgach (yoki qo'lda) serverga SSH orqali.
# Ma'lumot xavfsizligi: migratsiyadan oldin Contabo Auto Backup va kunlik pg_dump (R2 ga) mavjud.
# Xato bo'lsa serverda qo'lda git pull qilma — avval shu workflow logini ko'r.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # Faqat main'ga push'dan keyingi yashil CI (fork PR'idagi `main` nomli branch emas) yoki qo'lda
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: SSH sozlash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Serverda yangilash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          # Non-interaktiv SSH'da .bashrc yuklanmaydi — nvm bo'lsa node/npm/pm2 PATH'ga shu yerda qo'shiladi
          if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; fi
          cd ~/tizimlab
          git pull --ff-only
          npm ci
          npm run build
          npm run migrate -w backend
          pm2 restart tizimlab-api
          echo "Deploy qilingan commit: $(git rev-parse --short HEAD)"
          EOF

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -m 10 -o body.json -w '%{http_code}' https://lab.tizimlab.uz/api/v1/health || true)
            if [ "$code" = "200" ] && jq -e '.status == "ok"' body.json > /dev/null 2>&1; then
              echo "Health OK (urinish $i)"
              exit 0
            fi
            echo "Urinish $i: HTTP $code"
            sleep 3
          done
          echo "::error::Health check muvaffaqiyatsiz: /api/v1/health 200 {\"status\":\"ok\"} qaytarmadi"
          exit 1

      - name: Kalitni o'chirish
        if: always()
        run: rm -f ~/.ssh/id_deploy
